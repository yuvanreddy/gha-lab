name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Byte-compile sources (syntax check)
        run: python -m compileall -q .
      - name: Verify API token is available
        env:
          MY_API_TOKEN: ${{ secrets.MY_API_TOKEN }}
        run: |
          if [ -z "$MY_API_TOKEN" ]; then
            echo "MY_API_TOKEN is not set"
            exit 1
          fi
          echo "MY_API_TOKEN is set (length ${#MY_API_TOKEN})"
      - name: Generate build report
        run: |
          mkdir -p out
          {
            echo "Build report"
            echo "Commit: ${{ github.sha }}"
            echo "Python: $(python --version)"
            echo "Built at: $(date -u)"
            pip freeze
          } > out/build-report.txt
      - name: Upload build report
        uses: actions/upload-artifact@v4
        with:
          name: build-report-${{ matrix.python-version }}
          path: out/build-report.txt

  test:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Download build report
        uses: actions/download-artifact@v4
        with:
          name: build-report-${{ matrix.python-version }}
          path: out
      - name: Show build report
        run: cat out/build-report.txt
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: pytest
